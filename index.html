<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Movie App - Search and explore movies">
  <meta name="author" content="Your Name">
  <title>Movie Explorer</title>
  <link rel="stylesheet" href="movie-app/style/style.css">
</head>
<body>
  <header role="banner">
    <h1>Movie Explorer</h1>
    <nav role="navigation">
      <button id="favoritesBtn" aria-label="View Favorites">Favorites</button>
    </nav>
  </header>

  <main role="main">
    <section id="searchSection" aria-labelledby="searchHeading">  
      <h2 id="searchHeading">Search Movies</h2>
      <input type="text" id="searchInput" placeholder="Search for a movie..." aria-label="Movie search input">
      <button id="searchBtn">Search</button>
    </section>

    <section id="featured" aria-labelledby="featuredHeading">
      <div id="featuredContent">
        <h2 id="featuredHeading">Featured Movie</h2>
        <p id="featuredTitle"></p>
        <p id="featuredOverview"></p>
      </div>
    </section>

    <section id="results" aria-live="polite"></section>
    <section id="trending" aria-labelledby="trendingHeading">
      <h2 id="trendingHeading">Trending Movies</h2>
      <div id="trendingContent"></div>
    </section>
    <section id="favorites" aria-labelledby="favoritesHeading">
      <h2 id="favoritesHeading">Your Favorites</h2>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Movie Explorer | Powered by TMDb</p>
  </footer>

  <div id="trailerModal" class="trailer-modal">
    <div class="trailer-container">
      <button class="close-trailer" onclick="window.closeTrailer()">&times;</button>
      <iframe id="trailerIframe" class="trailer-iframe" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <script type="module" src="movie-app/script/app.js"></script>
</body>
</html>
